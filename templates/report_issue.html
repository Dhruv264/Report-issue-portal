<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Report Issue | Ahmedabad Civic Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ["Inter", "sans-serif"]
                    },
                    colors: {
                        primary: "#2563eb"
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-slate-50 text-slate-900">

<!-- Header -->
<header class="bg-white border-b">
    <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
        <h1 class="font-extrabold text-lg">Ahmedabad Civic Portal</h1>
        <nav class="flex gap-6 text-sm font-semibold">
            <a href="/dashboard" class="text-slate-600">Dashboard</a>
            <a href="/report-issue" class="text-primary">Report Issue</a>
            <a href="/my-issues" class="text-slate-600">My Issues</a>

            <form action="/logout" method="post">
                <button class="text-red-500 font-semibold">Logout</button>
            </form>
        </nav>
    </div>
</header>

<!-- Main -->
<main class="max-w-3xl mx-auto px-6 py-10">

    <!-- Title -->
    <div class="mb-8">
        <h2 class="text-3xl font-extrabold mb-2">Report a New Issue</h2>
        <p class="text-slate-500">
            Provide accurate details to help municipal authorities resolve the civic concern faster.
        </p>
    </div>

    <!-- Card -->
    <!-- ✅ enctype IS REQUIRED -->
    <form method="POST"
          action="/report-issue"
          enctype="multipart/form-data"
          class="bg-white rounded-xl shadow border p-8 space-y-6">

        <!-- Title & Category -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="font-semibold text-sm">Issue Title</label>
                <input name="title" required
                       placeholder="e.g. Large pothole near Vastrapur Lake"
                       class="mt-2 w-full border rounded-lg px-4 py-3 bg-slate-50 focus:ring-2 focus:ring-primary outline-none">
            </div>

            <div>
                <label class="font-semibold text-sm">Category</label>
                <select name="category" required
                        class="mt-2 w-full border rounded-lg px-4 py-3 bg-slate-50 focus:ring-2 focus:ring-primary outline-none">
                    <option>Roads & Potholes</option>
                    <option>Waste Management & Garbage</option>
                    <option>Water Supply & Drainage</option>
                    <option>Streetlights</option>
                    <option>Stray Animals</option>
                </select>
            </div>
        </div>

        <!-- Description -->
        <div>
            <label class="font-semibold text-sm">Description</label>
            <textarea name="description" required rows="5"
                      class="mt-2 w-full border rounded-lg px-4 py-3 bg-slate-50 focus:ring-2 focus:ring-primary outline-none"></textarea>
        </div>

        <!-- ✅ PHOTO UPLOAD (THIS WAS THE MISSING PART BEFORE) -->
        <div>
            <label class="font-semibold text-sm">Upload Photo (Optional)</label>
            <input type="file"
                   name="photo"
                   accept="image/*"
                   class="mt-2 w-full border rounded-lg px-4 py-3 bg-slate-50">
            <p class="text-xs text-slate-400 mt-1">
                JPG / PNG only · Max 5MB
            </p>
        </div>

        <!-- Location -->
        <div>
            <h3 class="font-semibold mb-3">Incident Location</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input name="area"
                       placeholder="Area / Ward (e.g. Navrangpura)"
                       class="border rounded-lg px-4 py-3 bg-slate-50 focus:ring-2 focus:ring-primary outline-none">
                <input name="pincode"
                       placeholder="Pincode (380009)"
                       class="border rounded-lg px-4 py-3 bg-slate-50 focus:ring-2 focus:ring-primary outline-none">
            </div>
        </div>

        <!-- Actions -->
        <div class="flex justify-between items-center pt-6 border-t">
            <a href="/dashboard" class="text-sm font-semibold text-slate-500 hover:text-slate-700">
                ← Back to Dashboard
            </a>

            <button type="submit"
                    class="bg-primary text-white px-6 py-3 rounded-lg font-semibold hover:bg-blue-700 transition">
                Submit Issue →
            </button>
        </div>
    </form>
</main>

<!-- Footer -->
<footer class="text-center text-xs text-slate-400 py-8">
    © 2024 Ahmedabad Municipal Corporation · Helpline 155303
</footer>

</body>
</html>
